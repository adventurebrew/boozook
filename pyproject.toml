[tool.poetry]
name = "boozook"
version = "0.1.0"
description = "Tools for extracting and editing Coktel Vision game resources"
authors = ["BLooperZ <blooperz@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
pakal = {git = "https://github.com/adventurebrew/pakal.git"}
numpy = "^2.2.6"
pillow = ">=11.2.1,<13.0.0"
prompt-toolkit = "^3.0.51"


[tool.poetry.group.dev.dependencies]
ruff = "^0.11.10"


[tool.poetry.group.release.dependencies]
pyinstaller = {version = ">=6.13.0", markers = "python_version < '3.14'"}
pip-licenses = "^5.0.0"

[tool.poetry.scripts]
boozook = "boozook.runner:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
